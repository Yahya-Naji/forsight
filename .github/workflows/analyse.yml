name: analyse

# Collection runs daily but nothing downstream did, which is why three of four
# pillars held zero evidence. This turns the stored documents into analysis:
# extract → merge → rules → synthesize → forecast, one job per pillar.
#
# Pillars are independent, so fail-fast is off: a model timeout on Procurement
# must not discard a completed Electronic Warfare run.
on:
  schedule:
    - cron: "40 4 * * *"          # daily, after the 03:17 collection sweep
  workflow_dispatch:
    inputs:
      pillar:
        description: "Single pillar (blank = all four)"
        required: false
        type: choice
        options: ["", CYBERSECURITY, AI, ELECTRONIC_WARFARE, PROCUREMENT]
      limit:
        description: "Documents to extract per pillar"
        required: false
        default: "12"
        type: string

concurrency:
  group: analyse
  cancel-in-progress: false

env:
  SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
  SUPABASE_SERVICE_KEY: ${{ secrets.SUPABASE_SERVICE_KEY }}
  AZURE_OPENAI_ENDPOINT: ${{ secrets.AZURE_OPENAI_ENDPOINT }}
  AZURE_OPENAI_KEY: ${{ secrets.AZURE_OPENAI_KEY }}
  AZURE_OPENAI_DEPLOYMENT: ${{ vars.AZURE_OPENAI_DEPLOYMENT }}
  AZURE_OPENAI_DEPLOYMENT_FAST: ${{ vars.AZURE_OPENAI_DEPLOYMENT_FAST }}

jobs:
  analyse:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    strategy:
      fail-fast: false
      max-parallel: 2               # the deployments are shared; don't self-throttle
      matrix:
        pillar: [CYBERSECURITY, AI, ELECTRONIC_WARFARE, PROCUREMENT]
    defaults:
      run:
        working-directory: pipeline
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
          cache-dependency-path: pipeline/requirements.txt
      - run: pip install -r requirements.txt

      - name: Skip pillars not requested
        id: gate
        run: |
          want="${{ inputs.pillar }}"
          if [ -n "$want" ] && [ "$want" != "${{ matrix.pillar }}" ]; then
            echo "run=false" >> $GITHUB_OUTPUT
          else
            echo "run=true" >> $GITHUB_OUTPUT
          fi

      - name: Extract
        if: steps.gate.outputs.run == 'true'
        run: python extract.py --pillar ${{ matrix.pillar }} --limit ${{ inputs.limit || 12 }}

      - name: Gate 3 · corroboration merge
        if: steps.gate.outputs.run == 'true'
        run: python decisions.py --gate 3 --pillar ${{ matrix.pillar }}

      - name: Rules
        if: steps.gate.outputs.run == 'true'
        run: python rules.py

      - name: Synthesize
        if: steps.gate.outputs.run == 'true'
        run: python synthesize.py --pillar ${{ matrix.pillar }}

      # Strength depends on corroboration, which synthesis just changed.
      - name: Rules (rescore)
        if: steps.gate.outputs.run == 'true'
        run: python rules.py

      - name: Forecast
        if: steps.gate.outputs.run == 'true'
        run: python forecast.py --pillar ${{ matrix.pillar }} --replace

      - name: Summary
        if: steps.gate.outputs.run == 'true'
        run: |
          python - <<'PY' >> $GITHUB_STEP_SUMMARY
          import sys; sys.path.insert(0,'.')
          from config import db
          sb, p = db(), "${{ matrix.pillar }}"
          rows = {t: len(sb.table(t).select("id").eq("pillar", p).execute().data)
                  for t in ("evidence","signals","findings","risks","forecasts")}
          print(f"### {p}\n")
          print("| " + " | ".join(rows) + " |")
          print("|" + "---|" * len(rows))
          print("| " + " | ".join(str(v) for v in rows.values()) + " |")
          PY
