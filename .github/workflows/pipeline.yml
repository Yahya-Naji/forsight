name: pipeline

# The run the console requests. /api/generate inserts a QUEUED pipeline_runs row
# and dispatches this workflow with that row's id; each stage reports progress
# back into it, so /generate reflects what actually ran rather than a guess.
on:
  # Safety net: a request the console could not dispatch (or whose dispatch was
  # lost) is picked up by this sweep within ten minutes. Free on a public repo.
  schedule:
    - cron: "*/10 * * * *"
  workflow_dispatch:
    inputs:
      pillar:
        description: "Pillar to report on"
        required: true
        default: ELECTRONIC_WARFARE
        type: choice
        options: [CYBERSECURITY, AI, ELECTRONIC_WARFARE, PROCUREMENT]
      run_id:
        description: "pipeline_runs row id (from the console)"
        required: false
        type: string
      title:
        description: "Report title"
        required: false
        type: string
      brief_id:
        description: "report_briefs id, when generated from a reader's brief"
        required: false
        type: string

concurrency:
  group: pipeline-${{ inputs.run_id || 'sweep' }}
  cancel-in-progress: false

env:
  SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
  SUPABASE_SERVICE_KEY: ${{ secrets.SUPABASE_SERVICE_KEY }}
  AZURE_OPENAI_ENDPOINT: ${{ secrets.AZURE_OPENAI_ENDPOINT }}
  AZURE_OPENAI_KEY: ${{ secrets.AZURE_OPENAI_KEY }}
  AZURE_OPENAI_DEPLOYMENT: ${{ vars.AZURE_OPENAI_DEPLOYMENT }}
  AZURE_OPENAI_DEPLOYMENT_FAST: ${{ vars.AZURE_OPENAI_DEPLOYMENT_FAST }}
  SERPER_API_KEY: ${{ secrets.SERPER_API_KEY }}
  RUN_ID: ${{ inputs.run_id }}
  PILLAR: ${{ inputs.pillar }}

jobs:
  report:
    runs-on: ubuntu-latest
    # A request drafts and verifies against the graph as it stands; collection,
    # extraction, synthesis and forecasting are the daily job (analyse.yml).
    timeout-minutes: 30
    defaults:
      run:
        working-directory: pipeline
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
          cache-dependency-path: pipeline/requirements.txt
      - run: pip install -r requirements.txt

      # rules → generate → verify --prune, defined once in request.py and shared
      # with the local runner. It reads pillar, template and brief from the row.
      - name: Fulfil the request
        env:
          GEN_DEPLOYMENT: ${{ vars.GEN_DEPLOYMENT || 'gpt-4o-mini' }}
        run: |
          if [ -n "$RUN_ID" ]; then
            python request.py --run-id "$RUN_ID"
          else
            python request.py --next-waiting
          fi

      - name: Mark the run failed if the job died
        if: failure()
        run: |
          python -c "
          import os, sys; sys.path.insert(0,'.')
          import config
          config.update_run(os.environ.get('RUN_ID'), status='FAILED',
                            error='workflow step failed — see the Actions log')"
